name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and DOM tests
        run: npm test

      - name: Build
        run: npm run build

  browser:
    name: Browser walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser download: scripts/browser-check.mjs launches the installed
      # Google Chrome (Playwright's `chrome` channel), which the ubuntu runner
      # image already provides. The Playwright driver itself comes from npm ci.

      - name: Build
        run: npm run build

      - name: Start the server
        run: node server/index.js &
        env:
          DIAGRAMS_DB: ${{ runner.temp }}/diagrams-ci.sqlite

      - name: Wait for the server
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4317/api/diagrams > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up on http://127.0.0.1:4317" >&2
          exit 1

      - name: Run the browser walkthrough
        run: npm run test:browser

      - name: Stop the server
        if: always()
        run: pkill -f 'node server/index.js' || true