name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Check and build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check content and external-link behavior
        run: node --test scripts/*.test.mjs

      - name: Check content migration and Astro project
        run: npm run check

      - name: Build static site and Archify readers
        run: npm run build

      - name: Verify static routes and Archify readers
        run: node scripts/check-static.mjs

      - name: Configure repository hosting path
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "SITE_URL=https://${REPO_OWNER,,}.github.io" >> "$GITHUB_ENV"
          if [[ "${REPO_NAME,,}" == "${REPO_OWNER,,}.github.io" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi

      - name: Build and verify GitHub Pages output
        run: |
          npm run build
          node scripts/check-static.mjs

      - name: Install browser for reader verification
        run: npx playwright install --with-deps chromium

      - name: Verify reading and diagram interactions
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/diagram-preview.log" 2>&1 &
          ready=false
          for attempt in {1..30}; do
            if curl --silent --fail "http://127.0.0.1:4321${BASE_PATH}" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/diagram-preview.log"
            exit 1
          fi
          npm run test:browser -- "http://127.0.0.1:4321${BASE_PATH}"

      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: static
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
