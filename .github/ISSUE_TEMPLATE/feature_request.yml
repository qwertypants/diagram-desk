name: Feature request

description: Suggest a capability or improvement to Diagram Desk

labels: ["enhancement", "needs triage"]

body:
  - type: markdown
    attributes:
      value: |
        Diagram Desk is a static learning library with interactive diagrams.
        Describe the reading, teaching, or authoring problem your proposal solves.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the feature you want.
      placeholder: |
        When reading the retrieval lesson, I cannot tell why the reranking
        step belongs after candidate retrieval.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      placeholder: Add a worked example of how reranking changes the candidate order.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including the workaround you use today.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Article or teaching content
        - Diagram
        - Site navigation or accessibility
        - Authoring, build, or deployment
        - Not sure
    validations:
      required: true
