name: Bug report

description: Something in Diagram Desk does not work as documented

labels: ["bug", "needs triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. The more exact the reproduction, the faster it
        gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include the exact wording of any error.
      placeholder: The diagram on /articles/ai-evaluation/ does not respond to zoom.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: The diagram zooms when I press the zoom-in control.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Starting from a fresh clone, what did you do?
      placeholder: |
        1. Open the article URL
        2. Scroll to the diagram
        3. Press the zoom-in control
    validations:
      required: true

  - type: textarea
    id: diagram-source
    attributes:
      label: Article URL, diagram slug, or Archify JSON
      description: If the problem involves a diagram, include its URL or catalog slug and any changed JSON.
      render: text

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Right-click, Inspect, Console. Paste any errors or red lines.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Node version (`node -v`), OS, browser and version."
      placeholder: "Node 24.1.0, macOS 15.0, Chrome 141"
    validations:
      required: true
