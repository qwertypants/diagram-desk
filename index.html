<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagram Desk</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/mobile.css" />
  </head>
  <body>
    <a class="skip-link" href="#stage">Skip to the diagram</a>
    <div class="desk">
      <header class="masthead">
        <h1 class="masthead__title">Diagram Desk</h1>
        <button id="library-toggle" class="masthead__library-toggle" type="button" aria-controls="library" aria-expanded="false">Library</button>
        <p class="masthead__strap">A local library of Mermaid diagrams</p>
      </header>
      <div class="desk__body">
        <aside id="library" class="library" aria-labelledby="library-heading"></aside>
        <button id="library-backdrop" class="mobile-drawer-backdrop" type="button" aria-label="Close library" tabindex="-1"></button>
        <main id="stage" class="stage" tabindex="-1"></main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
