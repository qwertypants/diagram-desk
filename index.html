<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Asset URLs are built relative (`base: './'` in vite.config.js) so the
      server can serve `dist/` from any directory. That only resolves correctly
      on deep links if the document itself declares a base, otherwise
      `/diagrams/<id>` would look for assets under `/diagrams/`.
    -->
    <base href="/" />
    <title>Diagram Desk</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#stage">Skip to the diagram</a>
    <div class="desk">
      <header class="masthead">
        <h1 class="masthead__title">Diagram Desk</h1>
        <p class="masthead__strap">A local library of Mermaid diagrams</p>
      </header>
      <div class="desk__body">
        <aside id="library" class="library" aria-labelledby="library-heading"></aside>
        <main id="stage" class="stage" tabindex="-1"></main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
